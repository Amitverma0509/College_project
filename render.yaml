# Render Blueprint. Put backend/ and frontend/ in ONE git repo with this file at the root.
services:
  - type: web
    name: rag-backend
    runtime: node
    rootDir: backend
    plan: free            # a persistent disk requires a paid plan
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: GROQ_API_KEY
        sync: false          # you enter this in the Render dashboard
      - key: DATA_DIR
        value: /tmp/data
      - key: CORS_ORIGIN
        value: https://rag-frontend.onrender.com   # change to your real frontend URL
      - key: NODE_VERSION
        value: 20

  - type: web
    name: rag-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        value: https://rag-backend.onrender.com    # change to your real backend URL
